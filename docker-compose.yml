services:
  mysql:
    image: mysql:8.0
    container_name: contextsql-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: contextsql
      MYSQL_USER: ctx
      MYSQL_PASSWORD: ctxpass
    ports:
      - "3307:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/02_glossary.sql:/docker-entrypoint-initdb.d/02_glossary.sql
