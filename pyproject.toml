[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextsql"
version = "0.1.0"
description = "Local, free, business-context-aware text-to-SQL agent"
requires-python = ">=3.9"
dependencies = ["sqlalchemy>=2.0", "pymysql>=1.1"]

[project.optional-dependencies]
postgres = ["psycopg2-binary"]

[project.scripts]
contextsql = "contextsql.cli:main"

[tool.setuptools]
packages = ["contextsql"]
