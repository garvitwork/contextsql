[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextsql_garvit"
version = "0.1.3"
description = "Local, free, business-context-aware text-to-SQL agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "huggingface_hub>=0.20",
  "llama-cpp-python",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary"]

[project.scripts]
contextsql = "contextsql.cli:main"

[tool.setuptools]
packages = ["contextsql"]